name: Swing Trade Picks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update outcomes for past picks
        run: python swing_outcomes.py

      - name: Run screener and send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python swing_main.py

      - name: Commit picks log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picks_log.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update picks log $(date +%Y-%m-%d)"
          git push || true
